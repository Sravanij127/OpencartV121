name: SonarQube Scan

on:
  push:
    branches:
      - main  # or the branch you want
  pull_request:

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'

      - name: SonarQube Scan
        uses: sonarsource/sonarcloud-github-action@master
        with:
          host-url: 'http://localhost:9000/tutorials?id=OpencartV121'
          token: ${{ secrets.SONAR_TOKEN }}
          projectKey: 'OpencartV1211'
          projectName: 'OpencartV121'
